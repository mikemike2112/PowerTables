# Test a ogni push su main e su ogni tag v*. Sui tag, se i test passano, compila l'app per
# Windows x64 (eseguibile unico con .NET incluso) e la allega alla GitHub Release come PowerTables-win-x64.zip.
# Il nome del file resta sempre lo stesso: il link
#   https://github.com/mikemike2112/PowerTables/releases/latest/download/PowerTables-win-x64.zip
# porta quindi sempre all'ultima versione.
name: release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    # Solo i test che non richiedono Office installato ne' una sessione grafica:
    # quelli completi si eseguono in locale prima di creare il tag.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - run: dotnet test tests/PowerTables.Tests -c Release --filter "Category!=OfficeCom&Category!=Ui&Category!=UI&Category!=UiAutomation&Category!=Load" --logger trx --results-directory tr
      - name: Test falliti come annotazioni
        # Le annotazioni si leggono anche senza login (API check-runs), il log no.
        if: failure()
        shell: pwsh
        run: |
          foreach ($f in Get-ChildItem tr -Filter *.trx -ErrorAction SilentlyContinue) {
            [xml]$x = Get-Content $f.FullName -Raw
            foreach ($r in $x.TestRun.Results.UnitTestResult | Where-Object outcome -eq 'Failed') {
              $m = ("$($r.Output.ErrorInfo.Message) $($r.Output.ErrorInfo.StackTrace)" -replace '\r?\n', ' | ')
              Write-Output "::error title=$($r.testName)::$($m.Substring(0, [Math]::Min(900, $m.Length)))"
            }
          }

  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Publish
        run: dotnet publish src/PowerTables.App -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=none -o out/PowerTables
      - name: Zip
        shell: pwsh
        run: |
          if (-not (Test-Path out/PowerTables/PowerTables.App.exe)) { throw "manca PowerTables.App.exe" }
          Compress-Archive -Path out/PowerTables -DestinationPath PowerTables-win-x64.zip
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" "PowerTables-win-x64.zip" --title "PowerTables ${{ github.ref_name }}" --notes "Progetto nelle fasi iniziali: incompleto e con possibili bug. Estrai lo zip e apri PowerTables.App.exe. Se Windows mostra 'Windows ha protetto il PC', clicca Ulteriori informazioni e poi Esegui comunque."
